<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact form</title>
    <link rel="stylesheet" href="contactform.css">
</head>

<body>
    <form action="login">
        <div>
            <h1>Contact Us</h1>
            <div class="one">
                <div class="first">
                    <label>First Name *</label>
                    <input type="text">
                </div>
                <div class="second">
                    <label>Last Name *</label>
                    <input type="text">

                </div>
            </div>
            <div class="two">
                <label>Email Address *</label><br>
                <input type="email">

            </div>
            <div class="three">
                <div>
                    <label>Query Type *</label>
                    <div class="third">
                        <input type="radio">
                        <p>General Enquiry</p>
                    </div>
                </div>
                <div>
                    <div class="fourth">
                        <input type="radio">
                        <p>Support Request</p>
                    </div>

                </div>
            </div>
            <div class="four">
                <label>Message *</label>
                <div></div>

            </div>
            <div class="five">
                <div></div>
                <p>I consent to being contacted by the team *</p>

            </div>
            <div class="six">
                <div>
                    Submit
                </div>

            </div>
        </div>
    </form>
</body>

</html>
